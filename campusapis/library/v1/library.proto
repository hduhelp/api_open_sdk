syntax = "proto3";

package campusapis.library.v1;

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./campusapis/library/v1";

service LibraryService {
  rpc GetAttendanceStats(GetAttendanceStatsRequest) returns (GetAttendanceStatsResponse) {
    option (google.api.http) = {
      get: "/library/v1/attendance/stats"
    };
  }

  rpc GetTimeSlotStats(GetTimeSlotStatsRequest) returns (GetTimeSlotStatsResponse) {
    option (google.api.http) = {
      get: "/library/v1/attendance/time-slots"
    };
  }

  rpc GetFloorStats(GetFloorStatsRequest) returns (GetFloorStatsResponse) {
    option (google.api.http) = {
      get: "/library/v1/attendance/floors"
    };
  }

  rpc GetMonthlyStats(GetMonthlyStatsRequest) returns (GetMonthlyStatsResponse) {
    option (google.api.http) = {
      get: "/library/v1/attendance/months"
    };
  }

  rpc GetReadingSummary(GetReadingSummaryRequest) returns (GetReadingSummaryResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/summary"
    };
  }

  rpc GetFirstBook(GetFirstBookRequest) returns (GetFirstBookResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/first-book"
    };
  }

  rpc GetMonthStats(GetMonthStatsRequest) returns (GetMonthStatsResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/months"
    };
  }

  rpc GetMaxMonth(GetMaxMonthRequest) returns (GetMaxMonthResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/max-month"
    };
  }

  rpc GetLeastPopular(GetLeastPopularRequest) returns (GetLeastPopularResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/least-popular"
    };
  }

  rpc GetPreference(GetPreferenceRequest) returns (GetPreferenceResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/preference"
    };
  }

  rpc GetTotalTime(GetTotalTimeRequest) returns (GetTotalTimeResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/total-time"
    };
  }

  rpc GetBorrowList(GetBorrowListRequest) returns (GetBorrowListResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/borrows"
    };
  }

  rpc CheckReadNewer(google.protobuf.Empty) returns (CheckReadNewerResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/newer"
    };
  }

  rpc GetAllReadData(GetAllReadDataRequest) returns (GetAllReadDataResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/all"
    };
  }

  rpc GetUnreturnedBooks(google.protobuf.Empty) returns (GetUnreturnedBooksResponse) {
    option (google.api.http) = {
      get: "/library/v1/read/unreturned"
    };
  }

  rpc GetShareID(google.protobuf.Empty) returns (GetShareIDResponse) {
    option (google.api.http) = {
      get: "/library/v1/share"
    };
  }

  rpc GetStaffIDByShareID(GetStaffIDByShareIDRequest) returns (GetStaffIDByShareIDResponse) {
    option (google.api.http) = {
      get: "/library/v1/share/{shareId}/staff"
    };
  }
}

message GetAttendanceStatsRequest {
  string start = 1;
  string end = 2;
}

message GetTimeSlotStatsRequest {
  string start = 1;
  string end = 2;
}

message GetFloorStatsRequest {
  string start = 1;
  string end = 2;
}

message GetMonthlyStatsRequest {
  string start = 1;
  string end = 2;
}

message GetReadingSummaryRequest {
  string start = 1;
  string end = 2;
}

message GetFirstBookRequest {
  string start = 1;
  string end = 2;
}

message GetMonthStatsRequest {
  string start = 1;
  string end = 2;
}

message GetMaxMonthRequest {
  string start = 1;
  string end = 2;
}

message GetLeastPopularRequest {
  string start = 1;
  string end = 2;
}

message GetPreferenceRequest {
  string start = 1;
  string end = 2;
}

message GetTotalTimeRequest {
  string start = 1;
  string end = 2;
}

message GetBorrowListRequest {
  string start = 1;
  string end = 2;
  int32 page = 3;
  int32 size = 4;
}

message GetAllReadDataRequest {
  string start = 1;
  string end = 2;
  int32 page = 3;
  int32 size = 4;
}

message GetStaffIDByShareIDRequest {
  string shareId = 1;
}

message GetAttendanceStatsResponse {
  int32 error = 1;
  string msg = 2;
  AttendanceStats data = 3;
}

message GetTimeSlotStatsResponse {
  int32 error = 1;
  string msg = 2;
  repeated TimeSlotStats data = 3;
}

message GetFloorStatsResponse {
  int32 error = 1;
  string msg = 2;
  repeated FloorStats data = 3;
}

message GetMonthlyStatsResponse {
  int32 error = 1;
  string msg = 2;
  repeated MonthlyStats data = 3;
}

message GetReadingSummaryResponse {
  int32 error = 1;
  string msg = 2;
  ReadingSummary data = 3;
}

message GetFirstBookResponse {
  int32 error = 1;
  string msg = 2;
  FirstBook data = 3;
}

message GetMonthStatsResponse {
  int32 error = 1;
  string msg = 2;
  repeated MonthStats data = 3;
}

message GetMaxMonthResponse {
  int32 error = 1;
  string msg = 2;
  MaxMonth data = 3;
}

message GetLeastPopularResponse {
  int32 error = 1;
  string msg = 2;
  repeated BookStats data = 3;
}

message GetPreferenceResponse {
  int32 error = 1;
  string msg = 2;
  Preference data = 3;
}

message GetTotalTimeResponse {
  int32 error = 1;
  string msg = 2;
  Total data = 3;
}

message GetBorrowListResponse {
  int32 error = 1;
  string msg = 2;
  BorrowList data = 3;
}

message CheckReadNewerResponse {
  int32 error = 1;
  string msg = 2;
  bool data = 3;
}

message GetAllReadDataResponse {
  int32 error = 1;
  string msg = 2;
  FlatReadData data = 3;
}

message GetUnreturnedBooksResponse {
  int32 error = 1;
  string msg = 2;
  BorrowList data = 3;
}

message GetShareIDResponse {
  int32 error = 1;
  string msg = 2;
  string data = 3;
}

message GetStaffIDByShareIDResponse {
  int32 error = 1;
  string msg = 2;
  string data = 3;
}

message GetReturnDateResponse {
  int32 error = 1;
  string msg = 2;
  string returnDate = 3;
}

message AttendanceStats {
  string staffId = 1;
  google.protobuf.Timestamp firstVisitTime = 2;
  int32 totalStayDays = 3;
  int32 totalStayHours = 4;
  int32 totalVisitCount = 5;
  google.protobuf.Timestamp earliestTime = 6;
  google.protobuf.Timestamp latestTime = 7;
  string mostFrequentTimeSlot = 8;
  string mostVisitedMonth = 9;
  int32 mostVisitedMonthCount = 10;
  string mostFrequentFloor = 11;
  int32 mostFrequentFloorCount = 12;
}

message TimeSlotStats {
  int32 hour = 1;
  int32 count = 2;
}

message FloorStats {
  string floor = 1;
  int32 count = 2;
}

message MonthlyStats {
  string month = 1;
  int32 count = 2;
}

message ReadingSummary {
  string staffId = 1;
  int32 rank = 2;
  int64 totalBooks = 3;
  double percentile = 4;
  bool hasRecord = 5;
}

message FirstBook {
  string bookName = 1;
  google.protobuf.Timestamp borrowTime = 2;
}

message MonthStats {
  int32 month = 1;
  int32 count = 2;
}

message MaxMonth {
  int32 month = 1;
  int32 count = 2;
}

message BookStats {
  string bookName = 1;
  int32 borrowCount = 2;
}

message Preference {
  string longestBook = 1;
  string favoriteCategory = 2;
  string topPublisher = 3;
  int32 borrowedCount = 4;
}

message Total {
  int32 days = 1;
  int32 hours = 2;
}

message BookList {
  string bookName = 1;
  string bookBarcode = 2;
  google.protobuf.Timestamp borrowDate = 3;
  google.protobuf.Timestamp returnDate = 4;
  google.protobuf.Timestamp dueDate = 5;
}

message BorrowList {
  string staffId = 1;
  int64 total = 2;
  repeated BookList books = 3;
}

message FlatReadData {
  string staffId = 1;
  int32 rank = 2;
  int64 totalBooks = 3;
  double percentile = 4;
  bool hasRecord = 5;
  string bookName = 6;
  google.protobuf.Timestamp borrowTime = 7;
  int32 maxMonth = 8;
  int32 maxMonthCount = 9;
  string leastPopularBook = 10;
  int32 leastPopularBorrowCount = 11;
  string longestBook = 12;
  string favoriteCategory = 13;
  string topPublisher = 14;
  int32 borrowedCount = 15;
  int32 days = 16;
  int32 hours = 17;
  int64 total = 18;
  repeated BookList books = 19;
  bool isNewer = 20;
}
